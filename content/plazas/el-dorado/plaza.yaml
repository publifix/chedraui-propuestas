legales:
  leyenda_imagenes: Imágenes ilustrativas. Condiciones sujetas a disponibilidad y a la vigencia indicada. # DEMO
  # Sin aviso externo (aviso_privacidad_url), el texto se publica en /privacidad/el-dorado/.
  aviso_privacidad: # DEMO: texto genérico de demostración, a sustituir por el aviso oficial de Chedraui
    responsable: Inmobiliaria Chedraui, administradora de El Dorado Centro Comercial & Marina
    actualizado: junio de 2026
    secciones:
      - titulo: Responsable de tus datos
        texto: >-
          Inmobiliaria Chedraui, con domicilio en Carretera Federal Paso del Toro–Boca del Río–Antón
          Lizardo #4405, Col. El Novillero, Boca del Río, Veracruz, C.P. 94290, es responsable del
          tratamiento de los datos personales que nos compartas al solicitar información sobre
          locales comerciales.
      - titulo: Qué datos tratamos y para qué
        texto: >-
          Tratamos tu nombre, la empresa o marca que representas, tu teléfono y tu correo
          electrónico, únicamente para darte seguimiento comercial: enviarte propuestas,
          resolver tus dudas y agendar visitas a la plaza. No tratamos datos sensibles.


          Esta propuesta registra de forma anónima cómo se consulta (secciones vistas y tiempo de
          lectura) para mejorar el material comercial. No usamos cookies de terceros ni guardamos tu
          dirección IP.
      - titulo: Con quién compartimos tus datos
        texto: >-
          No vendemos ni compartimos tus datos con terceros, salvo con los proveedores que nos
          ayudan a preparar y publicar las propuestas, quienes los tratan con la misma
          confidencialidad, y cuando una autoridad competente lo requiera.
      - titulo: Tus derechos ARCO
        texto: >-
          Puedes acceder, rectificar o cancelar tus datos, u oponerte a su tratamiento, escribiendo a
          administracion@centrocomercialeldorado.mx. Te responderemos en un plazo máximo de 20 días
          hábiles.
      - titulo: Cambios a este aviso
        texto: >-
          Cualquier cambio a este aviso de privacidad se publicará en esta misma página.
