tema:
  # Morado de marca #660066 tomado del PDF de disponibilidad de Chedraui (junio 2026);
  # el resto de tonos se deriva de él. Paleta aprobada en el paso 4.
  colores:
    fondo: "#f9f5f8"
    superficie: "#ffffff"
    texto: "#22101f"
    texto_suave: "#6a5466"
    acento: "#660066"
    # Morado claro del PDF: #660066 al 66 % sobre blanco. Para gráficas y rangos.
    acento_suave: "#9a579a"
    linea: "#e8dce5"
    marca: "#660066"
    texto_marca: "#ffffff"
  # Aprobada en el paso 4: Archivo como única familia; Newsreader itálica solo en la cita pivote.
  tipografias:
    display: Archivo
    cuerpo: Archivo
    cita: Newsreader
  # Logo vertical (velero + EL DORADO + CENTRO COMERCIAL), morado sobre transparente.
  logo: media/logo-el-dorado.png
  # Velero recortado del logo, cuadrado, para favicon.
  icono: media/icono-velero.png

frase_principal: Frente a la marina. Frente a tu cliente. # DEMO

